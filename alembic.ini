[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = os

# Online migrations require DATABASE_URL. This placeholder supplies the MySQL
# dialect only for offline SQL generation and never contains usable credentials.
sqlalchemy.url = mysql+asyncmy://placeholder:placeholder@localhost/deviation_protocol?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
